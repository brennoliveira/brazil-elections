[project]
name = "pipelines"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "brennoliveira", email = "brenno.oliveira@souunit.com.br" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "jupyter>=1.1.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[project.scripts]
pipelines = "pipelines:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
